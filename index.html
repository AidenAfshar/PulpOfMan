<!-- ═══════════════════════════════════════════════════════════════════
     A PULP OF MAN
     Entries are photographs or PDFs of handwriting, named
     YYYY-MM-DD-anything.jpg, living in the entries/ folder of the repo.

     To add one: tap the title five times quickly. Nothing about that
     door is published — see THE HIDDEN DOOR near the foot of this file.
     ═══════════════════════════════════════════════════════════════ -->
<script>
  const SOURCE = {
    // ── the GitHub folder your entries live in ──
    user:   "AidenAfshar",
    repo:   "PulpOfMan",
    branch: "master",
    dir:    "entries",

    // ── Google Drive (optional; leave empty and it isn't used) ──
    drive:  ""                        // an Apps Script Web app URL ending in /exec
  };
</script>

<style>
:root{
  --rowH: 278px;      /* one shelf's worth of vertical space          */
  --base: 60px;       /* space under a scroll's foot: slab + shadow   */
  --sink: 15px;       /* how far onto the slab's top surface it sits  */
  --shelfH: 94px;     /* rendered height of shelf.png in css pixels   */
  --ink: #2b3350;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; min-height:100vh;
  display:flex; flex-direction:column;
  color:#cdc4ad;
  font-family:"Cormorant Garamond", Georgia, serif;
  background:#131210;
  overflow-x:hidden;
  opacity:0; transition:opacity 1s ease;
}
body.ready{ opacity:1; }

/* ── the wall ─────────────────────────────────────────────── */
#wall{
  position:fixed; inset:0; z-index:-3;
  background:#131210 url(assets/wall.jpg) repeat center top;
  background-size:640px 640px;
}
#lamp{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(120% 74% at 50% -14%, rgba(255,240,208,.20) 0%, rgba(255,238,205,.05) 40%, rgba(0,0,0,0) 70%),
    radial-gradient(112% 92% at 50% 34%, rgba(0,0,0,0) 24%, rgba(0,0,0,.55) 74%, rgba(0,0,0,.86) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0) 34%, rgba(0,0,0,.60) 100%);
}
#grain{
  position:fixed; inset:0; z-index:9; pointer-events:none;
  opacity:.20; mix-blend-mode:overlay; background-repeat:repeat;
}

/* ── the title, painted on the stone ──────────────────────── */
header{ text-align:center; padding:clamp(32px,7vh,72px) 16px clamp(24px,5vh,44px); user-select:none; }
h1{
  margin:0; font-weight:300;
  font-size:clamp(22px, 4.8vw, 35px);
  letter-spacing:.32em; text-indent:.32em; text-transform:uppercase;
  color:rgba(226,210,176,.56);
  text-shadow:0 1px 0 rgba(0,0,0,.9), 0 2px 7px rgba(0,0,0,.7), 0 0 28px rgba(226,205,160,.10);
}

/* ── shelves ──────────────────────────────────────────────── */
main{ flex:1 0 auto; padding-bottom:clamp(24px,9vh,110px); }
#shelves{
  position:relative;
  display:flex; flex-wrap:wrap; align-items:flex-end;
  padding:0 clamp(22px, 7vw, 130px);
}
.plank{
  position:absolute; z-index:0; pointer-events:none;
  left:calc(50% - 50vw); width:100vw; height:var(--shelfH);
  background:url(assets/shelf.png) repeat-x left top;
  background-size:1024px var(--shelfH);
}
.slot{
  position:relative; z-index:1;
  height:var(--rowH);
  display:flex; align-items:flex-end;
  padding-bottom:var(--base);
  cursor:pointer;
}
.slot:focus{ outline:none; }

.scroll{
  position:relative;
  height:var(--h);
  transform-origin:50% 100%;
  transform:rotate(var(--tilt));
  transition:transform .45s cubic-bezier(.2,.9,.25,1), filter .45s ease;
  will-change:transform;
}
.scroll img{ display:block; height:100%; width:auto; }
.slot:hover .scroll, .slot:focus-visible .scroll{
  transform:translateY(-10px) rotate(var(--tilt));
  filter:brightness(1.10);
}
.scroll.hidden{ visibility:hidden; }

.scroll .shadow{               /* what it throws onto the slab */
  position:absolute; z-index:-1;
  left:-46%; right:-30%; bottom:1px; height:15px;
  background:radial-gradient(46% 50% at 56% 50%, rgba(0,0,0,.78) 0%, rgba(0,0,0,.32) 48%, rgba(0,0,0,0) 78%);
  filter:blur(2.5px);
}
.scroll .date{                 /* inked down the length of the roll */
  position:absolute; left:50%; top:52%;
  transform:translate(-50%,-50%) rotate(-90deg);
  font-family:"Caveat","Segoe Script",cursive;
  font-size:16px; line-height:1; white-space:nowrap;
  color:var(--ink); opacity:.72;
  text-shadow:0 .5px 0 rgba(255,255,255,.28);
  pointer-events:none;
}

/* ── the blue feather: today's entries only ───────────────── */
.slot.has-feather{ z-index:4; }
.feather{
  position:absolute; left:100%; top:-2px;
  width:44px; height:116px; margin-left:-16px;
  transform-origin:50% 3px;
  animation:sway 7.5s ease-in-out infinite;
  pointer-events:none;
  filter:drop-shadow(-2px 5px 5px rgba(0,0,0,.6));
}
@keyframes sway{ 0%,100%{transform:rotate(7deg)} 50%{transform:rotate(-8deg)} }

/* ── the opened scroll ────────────────────────────────────── */
#stage{ position:fixed; inset:0; z-index:20; pointer-events:none; }
#stage.on{ pointer-events:auto; }
#scrim{
  position:absolute; inset:0; opacity:0; transition:opacity .6s ease;
  background:radial-gradient(120% 90% at 50% 28%, rgba(8,7,6,.60) 0%, rgba(5,4,4,.92) 100%);
  backdrop-filter:blur(3px);
}
#stage.on #scrim{ opacity:1; }

#open{
  position:absolute; margin:0;
  display:flex; flex-direction:column; align-items:center;
  opacity:0; filter:drop-shadow(0 26px 42px rgba(0,0,0,.8));
}
#stage.on #open{ opacity:1; }
#open.flying{ transition:left .62s cubic-bezier(.22,.85,.24,1), top .62s cubic-bezier(.22,.85,.24,1), width .62s cubic-bezier(.22,.85,.24,1); }

#open .rod{
  position:relative; flex:0 0 auto; width:100%; height:23px; z-index:2;
  background:url(assets/rod-body.png) repeat-x left center;
  background-size:auto 100%;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.5));
}
#open .rod::before, #open .rod::after{
  content:""; position:absolute; top:0; width:9px; height:100%;
  background:url(assets/rod-end.png) no-repeat center/100% 100%;
}
#open .rod::before{ left:-9px; transform:scaleX(-1); }
#open .rod::after { right:-9px; }
#open .rod.bottom{ filter:brightness(.9) drop-shadow(0 4px 9px rgba(0,0,0,.55)); }

#open .sheet{
  width:100%; height:0; overflow:hidden; position:relative; z-index:1;
  background:#e9e1cb url(assets/paper.jpg) repeat;
  background-size:220px;
  box-shadow:inset 7px 0 16px -9px rgba(70,58,36,.8), inset -7px 0 16px -9px rgba(70,58,36,.8);
  transition:height .95s cubic-bezier(.24,.86,.22,1);
}
#open.unrolled .sheet{ overflow:auto; scrollbar-width:none; -ms-overflow-style:none; }
#open .sheet::-webkit-scrollbar{ display:none; }
#open .sheet::after{             /* the curl still held by the top roll */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom, rgba(64,52,32,.30), rgba(64,52,32,0) 30px);
}
#open .stack{ width:100%; cursor:zoom-in; transition:width .45s ease; }
#open.zoomed .stack{ width:215%; max-width:none; cursor:zoom-out; }
#open .stack img, #open .stack canvas{ display:block; width:100%; height:auto; }
#open .stack canvas + canvas{ border-top:1px solid rgba(96,82,54,.20); }  /* fold between pages */

/* ── the hidden door: five taps on the title ───────────────── */
#gate{ position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:20px; }
#gate.on{ display:flex; }
#gate .veil{ position:absolute; inset:0; background:rgba(7,6,5,.88); backdrop-filter:blur(5px); }
#gate .leaf{
  position:relative; width:min(430px, 92vw);
  padding:30px 28px 24px;
  background:#e9e1cb url(assets/paper.jpg) repeat; background-size:220px;
  box-shadow:0 26px 54px rgba(0,0,0,.75);
  color:#2b3350;
  font-family:"Cormorant Garamond", Georgia, serif;
}
#gate h2{
  margin:0 0 18px; font-weight:400; font-size:19px;
  letter-spacing:.16em; text-transform:uppercase; opacity:.72;
}
#gate label{ display:block; font-size:15px; letter-spacing:.05em; opacity:.72; margin:14px 0 5px; }
#gate input[type=text], #gate input[type=password], #gate input[type=date], #gate input[type=file]{
  width:100%; padding:9px 10px;
  font-family:"Caveat","Segoe Script",cursive; font-size:20px; color:#2b3350;
  background:rgba(255,255,255,.42); border:none;
  border-bottom:1.5px solid rgba(43,51,80,.42); border-radius:2px;
}
#gate input:focus{ outline:none; border-bottom-color:#2b3350; background:rgba(255,255,255,.62); }
#gate input[type=file]{ font-family:inherit; font-size:15px; }
#gate button{
  margin-top:22px; width:100%; padding:11px;
  font-family:"Cormorant Garamond", Georgia, serif; font-size:16px;
  letter-spacing:.22em; text-transform:uppercase;
  color:#efe7d3; background:#2b3350; border:none; border-radius:2px; cursor:pointer;
}
#gate button:disabled{ opacity:.45; cursor:default; }
#gate .say{ margin-top:14px; font-size:15px; min-height:20px; letter-spacing:.03em; }
#gate .say.bad{ color:#8c2f28; }
#gate .hint{ margin-top:16px; font-size:13px; opacity:.5; line-height:1.45; }
#gate .forget{ float:right; font-size:13px; opacity:.45; cursor:pointer; text-decoration:underline; }
#gate .step{ display:none; }
#gate .step.on{ display:block; }
h1{ cursor:default; }

@media (prefers-reduced-motion: reduce){
  #open.flying, #open .sheet, .scroll, .feather{ transition-duration:.001s !important; animation:none !important; }
}
</style>
</head>

<body>
<div id="wall"></div>
<div id="lamp"></div>
<div id="grain"></div>

<header><h1>A Pulp Of Man</h1></header>
<main><div id="shelves"></div></main>

<div id="stage" aria-hidden="true">
  <div id="scrim"></div>
  <figure id="open">
    <div class="rod top"></div>
    <div class="sheet"><div class="stack"></div></div>
    <div class="rod bottom"></div>
  </figure>
</div>

<!-- opens only after five quick taps on the title -->
<div id="gate" aria-hidden="true">
  <div class="veil"></div>
  <div class="leaf">

    <div class="step" id="stepSetup">
      <h2>First, the key</h2>
      <label for="gToken">GitHub token (fine-grained, Contents: read &amp; write)</label>
      <input id="gToken" type="password" autocomplete="off" spellcheck="false">
      <label for="gPinNew">Choose a PIN for this device</label>
      <input id="gPinNew" type="password" inputmode="numeric" autocomplete="off">
      <button id="gSave">Remember on this device</button>
      <p class="hint">The token is encrypted with your PIN and kept only in this
        browser. It is never written into the site, so nothing secret is published.</p>
      <div class="say" id="saySetup"></div>
    </div>

    <div class="step" id="stepPin">
      <h2>PIN <span class="forget" id="gForget">forget this device</span></h2>
      <input id="gPin" type="password" inputmode="numeric" autocomplete="off" autofocus>
      <button id="gUnlock">Unlock</button>
      <div class="say" id="sayPin"></div>
    </div>

    <div class="step" id="stepPost">
      <h2>New entry</h2>
      <label for="gFile">The page — photograph or PDF</label>
      <input id="gFile" type="file" accept="image/*,application/pdf">
      <label for="gDate">Dated</label>
      <input id="gDate" type="date">
      <label for="gNote">A word for the filename (optional)</label>
      <input id="gNote" type="text" spellcheck="false" placeholder="morning">
      <button id="gPost">Publish</button>
      <div class="say" id="sayPost"></div>
    </div>

  </div>
</div>

<script>
/* ── a little film grain over everything ──────────────────── */
(function(){
  const s=112, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const ctx=cv.getContext('2d'), im=ctx.createImageData(s,s), D=im.data;
  let a=1337;
  const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  for(let i=0;i<s*s;i++){ const v=rnd(); D[i*4]=128; D[i*4+1]=126; D[i*4+2]=120; D[i*4+3]=v<.5?0:(v-.5)*80; }
  ctx.putImageData(im,0,0);
  document.getElementById('grain').style.backgroundImage=`url(${cv.toDataURL()})`;
})();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ── the feather ──────────────────────────────────────────── */
const FEATHER = `
<svg class="feather" viewBox="0 0 38 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><linearGradient id="fv" x1=".1" y1="0" x2=".95" y2=".85">
    <stop offset="0" stop-color="#8cc2ea"/><stop offset=".30" stop-color="#5b95cd"/>
    <stop offset=".68" stop-color="#33639b"/><stop offset="1" stop-color="#1a3f6d"/>
  </linearGradient></defs>
  <path d="M19 2 C 18.4 9, 19.6 16, 19 24" stroke="#7d745f" stroke-width="1.05" fill="none" opacity=".9"/>
  <circle cx="19" cy="2.2" r="1.9" fill="#8a7f68" stroke="#241f19" stroke-width=".6"/>
  <path d="M19 25 C 10.5 37, 7.6 55, 12.6 73 C 14.4 79, 17.2 84, 19 86.5
           C 20.8 84, 23.6 79, 25.4 73 C 30.4 55, 27.5 37, 19 25 Z" fill="url(#fv)"/>
  <g stroke="#102a4a" stroke-width=".5" opacity=".34" fill="none">
    <path d="M19 33 C 15 36, 12.6 39.5, 11.6 43"/><path d="M19 41 C 14.4 44.6, 11.4 49, 10.2 53.5"/>
    <path d="M19 50 C 14.2 54, 11.4 58.6, 10.6 63.5"/><path d="M19 59 C 14.6 63, 12.2 67.6, 11.8 72"/>
    <path d="M19 68 C 15.4 71.6, 13.6 75.4, 13.6 79"/>
    <path d="M19 33 C 23 36, 25.4 39.5, 26.4 43"/><path d="M19 41 C 23.6 44.6, 26.6 49, 27.8 53.5"/>
    <path d="M19 50 C 23.8 54, 26.6 58.6, 27.4 63.5"/><path d="M19 59 C 23.4 63, 25.8 67.6, 26.2 72"/>
    <path d="M19 68 C 22.6 71.6, 24.4 75.4, 24.4 79"/>
  </g>
  <path d="M13.4 62 C 10.4 65.6, 8.8 68.6, 8.2 71.4" stroke="#4a7cb2" stroke-width=".8" fill="none" opacity=".8"/>
  <path d="M25 46 C 28.4 49.4, 30.2 52.6, 30.8 55.6" stroke="#2f628f" stroke-width=".8" fill="none" opacity=".8"/>
  <path d="M19 26 L19 86" stroke="#e4eff9" stroke-width="1" opacity=".5" fill="none"/>
  <path d="M19 84 C 18.4 89, 17.6 92.5, 16.4 95.5" stroke="#9fb6cc" stroke-width="1.1" fill="none" opacity=".75" stroke-linecap="round"/>
</svg>`;

/* ── entries ──────────────────────────────────────────────── */
const FILE_RE = /\.(jpe?g|png|webp|gif|avif|heic|heif|pdf)$/i;
const MONTHS  = ["January","February","March","April","May","June",
                 "July","August","September","October","November","December"];
const VARIANTS = 8;

const todayKey = (()=>{ const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();

/* The date comes from the filename and nowhere else. Anchored at the start,
   so a stray number later in the name can never be mistaken for one; a date
   further in still counts, so "scan 2026-08-17.jpg" works too. */
function dateFrom(name){
  const m = name.match(/^(\d{4})-(\d{2})-(\d{2})/) || name.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3];
  if(mo<1 || mo>12 || d<1 || d>31) return null;
  return { key:`${m[1]}-${m[2]}-${m[3]}`, label:`${d} ${MONTHS[mo-1]} ${y}` };
}

/* Google serves the same picture from several addresses and quietly changes
   which one it prefers, so keep a chain and let the browser fall down it. */
function driveUrls(id){
  return [ `https://lh3.googleusercontent.com/d/${id}=w1600`,
           `https://drive.google.com/thumbnail?id=${id}&sz=w1600`,
           `https://drive.google.com/uc?export=view&id=${id}` ];
}

function makeEntry(name, urls, kind, id){
  const d = dateFrom(name);
  return { name, urls, id,
           kind: kind || (/\.pdf$/i.test(name) ? "pdf" : "image"),
           key: d && d.key, label: d ? d.label : "",
           today: !!d && d.key === todayKey };
}

async function fromDrive(){
  if(!SOURCE.drive) return [];
  const r = await fetch(SOURCE.drive, {cache:"no-store"});
  if(!r.ok) throw new Error("relay " + r.status);
  const j = await r.json();
  if(j && j.ok === false) throw new Error(j.error || "relay error");
  return (j.entries || [])
    .filter(f => f && f.name && (f.id || f.url))
    .map(f => makeEntry(f.name, f.url ? [f.url] : driveUrls(f.id), f.kind, f.id));
}

async function fromGitHub(){
  const {user, repo, branch, dir} = SOURCE;
  if(!user || /^YOUR-/.test(user)) return [];
  const head = {Accept:"application/vnd.github+json"};
  if(token) head.Authorization = "Bearer " + token;   // unlocked: a far higher rate limit
  const r = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${dir}?ref=${branch}`,
                        {headers: head, cache:"no-store"});
  if(r.status === 404) return [];                     // no entries folder yet — an empty shelf
  if(!r.ok) throw new Error("github " + r.status);
  const j = await r.json();
  if(!Array.isArray(j)) throw new Error("github: unexpected reply");
  return j.filter(f => f.type === "file" && FILE_RE.test(f.name))
          .map(f => makeEntry(f.name, [f.download_url]));
}

async function fromManifest(){
  const r = await fetch("entries.json", {cache:"no-store"});
  if(!r.ok) throw new Error("manifest " + r.status);
  const j = await r.json();
  const dir = SOURCE.dir || "entries";
  return (Array.isArray(j) ? j : j.entries || []).map(x => typeof x === "string"
    ? makeEntry(x.split("/").pop(), [x.includes("/") ? x : `${dir}/${x}`])
    : makeEntry(x.name || x.file || "", [x.url || `${dir}/${x.file || x.name}`]));
}

/* Drive first; the others only if Drive is unset or unreachable. */
async function loadEntries(){
  for(const src of [fromDrive, fromGitHub, fromManifest]){
    try{
      const list = await src();
      if(list.length) return list;
    }catch(e){ console.warn("[pulp]", src.name, "→", e.message); }
  }
  return [];
}

/* ── build the shelf ──────────────────────────────────────── */
const shelves = document.getElementById('shelves');

function render(entries){
  // newest first; anything whose filename carries no date goes to the very end
  entries.sort((a,b)=>
    (b.key||"").localeCompare(a.key||"") || a.name.localeCompare(b.name, undefined, {numeric:true}));
  const rnd = mulberry32(90210);
  shelves.innerHTML = "";
  entries.forEach((e, i)=>{
    const slot = document.createElement('div');
    slot.className = 'slot' + (e.today ? ' has-feather' : '');
    slot.style.margin = `0 ${Math.round(7+rnd()*9)}px`;
    slot.tabIndex = 0;
    slot.setAttribute('role','button');
    slot.setAttribute('aria-label', e.label || e.name);

    const s = document.createElement('div');
    s.className = 'scroll';
    s.style.setProperty('--h', Math.round(166 + rnd()*52) + 'px');
    s.style.setProperty('--tilt', ((rnd()-0.5)*2.4).toFixed(2) + 'deg');
    s.style.filter = `brightness(${(0.93+rnd()*0.14).toFixed(3)})`;
    s.innerHTML =
      '<div class="shadow"></div>' +
      `<img src="assets/scroll-${Math.floor(rnd()*VARIANTS)}.png" alt="" draggable="false">` +
      (e.label ? `<div class="date">${e.label}</div>` : '') +
      (e.today ? FEATHER : '');

    // a scroll's width is only known once its image decodes — re-lay the slabs then
    s.querySelector('img').addEventListener('load', schedulePlanks);

    slot.appendChild(s);
    slot.addEventListener('click', ()=>openScroll(e, s));
    slot.addEventListener('keydown', ev=>{
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openScroll(e, s); }
    });
    shelves.appendChild(slot);
  });
  drawPlanks();
}

/* one stone slab under each wrapped row, wherever the row happens to land */
function drawPlanks(){
  shelves.querySelectorAll('.plank').forEach(p=>p.remove());
  const css = getComputedStyle(document.documentElement);
  const rowH = parseFloat(css.getPropertyValue('--rowH'));
  const base = parseFloat(css.getPropertyValue('--base'));
  const sink = parseFloat(css.getPropertyValue('--sink'));
  const tops = new Set();
  shelves.querySelectorAll('.slot').forEach(el => tops.add(el.offsetTop));
  if(!tops.size) tops.add(0);                    // an empty shelf is still a shelf
  [...tops].sort((a,b)=>a-b).forEach(t=>{
    const p = document.createElement('div');
    p.className = 'plank';
    p.style.top = (t + rowH - base - sink) + 'px';
    shelves.appendChild(p);
  });
}
let plankTimer = 0;
function schedulePlanks(){ clearTimeout(plankTimer); plankTimer = setTimeout(drawPlanks, 40); }
addEventListener('resize', schedulePlanks);
if(window.ResizeObserver) new ResizeObserver(schedulePlanks).observe(shelves);

/* ── open / unroll ────────────────────────────────────────── */
const stage  = document.getElementById('stage');
const openEl = document.getElementById('open');
const sheet  = openEl.querySelector('.sheet');
const stack  = openEl.querySelector('.stack');
let token = null;              // the GitHub token, only after unlocking
let current = null, busy = false, gen = 0;   // gen: which open is the live one

/* ── a photograph: try each of Google's addresses in turn ──── */
function loadImage(urls){
  return new Promise((resolve, reject)=>{
    let i = 0;
    const im = new Image();
    im.decoding = "async";
    im.onload  = ()=> resolve(im);
    im.onerror = ()=> (++i < urls.length) ? im.src = urls[i]
                                          : reject(new Error("no address served"));
    im.src = urls[0];
  });
}

/* ── a PDF: pdf.js, loaded only the first time one is opened ── */
let pdfLib = null;
function ensurePdfLib(){
  if(pdfLib) return Promise.resolve(pdfLib);
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = "assets/pdfjs/pdf.min.js";
    s.onload = ()=>{
      pdfLib = window.pdfjsLib;
      pdfLib.GlobalWorkerOptions.workerSrc = "assets/pdfjs/pdf.worker.min.js";
      resolve(pdfLib);
    };
    s.onerror = ()=> reject(new Error("pdf.js would not load"));
    document.head.appendChild(s);
  });
}

const pdfCache = new Map();
async function pdfBytes(entry){
  if(pdfCache.has(entry.name)) return pdfCache.get(entry.name);
  let bytes;
  if(entry.id && SOURCE.drive){
    // Drive won't hand raw bytes to a browser, so the relay passes them through
    const sep = SOURCE.drive.indexOf('?') === -1 ? '?' : '&';
    const r = await fetch(SOURCE.drive + sep + "file=" + encodeURIComponent(entry.id));
    if(!r.ok) throw new Error("relay " + r.status);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "relay error");
    const bin = atob(j.b64);
    bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  }else{
    const r = await fetch(entry.urls[0]);
    if(!r.ok) throw new Error("pdf " + r.status);
    bytes = new Uint8Array(await r.arrayBuffer());
  }
  pdfCache.set(entry.name, bytes);
  return bytes;
}

async function drawPdf(entry, W, mine){
  const [lib, data] = await Promise.all([ensurePdfLib(), pdfBytes(entry)]);
  const doc = await lib.getDocument({data: data.slice()}).promise;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let ratio = 0;
  for(let n = 1; n <= doc.numPages; n++){
    if(mine !== gen) return ratio;        // a different scroll was opened; stop
    const page = await doc.getPage(n);
    const scale = (W * dpr) / page.getViewport({scale:1}).width;
    const vp = page.getViewport({scale});
    const cv = document.createElement('canvas');
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    stack.appendChild(cv);
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    ratio += vp.height / vp.width;          // pages stack, so heights add up
  }
  return ratio;
}

/* fill the sheet, and report how tall it wants to be per unit of width */
async function buildContent(entry, W, mine){
  stack.textContent = "";
  if(entry.kind === "pdf") return await drawPdf(entry, W, mine);
  const im = await loadImage(entry.urls);
  if(mine !== gen) return 1.4;
  stack.appendChild(im);
  im.alt = entry.label || entry.name;
  return (im.naturalHeight || 1400) / (im.naturalWidth || 1000);
}

function openScroll(entry, el){
  if(busy || current) return;
  busy = true; current = el;
  const mine = ++gen;
  const r  = el.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight;
  const W  = Math.min(560, vw * 0.86);

  openEl.classList.remove('flying','unrolled','zoomed');
  openEl.style.left  = r.left + 'px';
  openEl.style.top   = r.top  + 'px';
  openEl.style.width = r.width + 'px';
  sheet.style.height = '0px';
  sheet.scrollTop = 0;
  stage.classList.add('on');
  stage.setAttribute('aria-hidden','false');

  // lift off straight away — a multi-page PDF takes a moment, and the scroll
  // shouldn't sit on the shelf looking broken while it's fetched
  void openEl.offsetWidth;
  openEl.classList.add('flying');
  openEl.style.left  = Math.round((vw - W)/2) + 'px';
  openEl.style.top   = Math.round(Math.max(26, (vh - (W*1.4 + 56))/2)) + 'px';
  openEl.style.width = W + 'px';
  el.classList.add('hidden');

  // let it be closed again as soon as it has risen, even if a long PDF is
  // still drawing — nobody should be trapped waiting for a scan
  const risen = new Promise(res => setTimeout(()=>{ busy = false; res(); }, 560));
  const ready = buildContent(entry, W, mine).catch(err=>{
    console.warn("[pulp]", entry.name, "→", err.message);
    return 1.4;                                    // unroll anyway, blank
  });

  Promise.all([risen, ready]).then(([, ratio])=>{
    if(mine !== gen || current !== el) return;     // closed while we waited
    const H = Math.min(W * ratio, vh - 160);
    openEl.style.top = Math.round(Math.max(26, (vh - (H + 56))/2)) + 'px';
    openEl.classList.add('unrolled');
    sheet.style.height = Math.round(H) + 'px';
  });
}

function closeScroll(){
  if(busy || !current) return;
  busy = true;
  const el = current;
  openEl.classList.remove('unrolled','zoomed');
  sheet.style.height = '0px';
  setTimeout(()=>{
    const r = el.getBoundingClientRect();
    openEl.style.left  = r.left + 'px';
    openEl.style.top   = r.top  + 'px';
    openEl.style.width = r.width + 'px';
    stage.classList.remove('on');
    stage.setAttribute('aria-hidden','true');
    setTimeout(()=>{ el.classList.remove('hidden'); current=null; busy=false; }, 480);
  }, 620);
}

document.getElementById('scrim').addEventListener('click', closeScroll);
openEl.querySelectorAll('.rod').forEach(r=>r.addEventListener('click', closeScroll));
sheet.addEventListener('click', ()=>{ if(!busy) openEl.classList.toggle('zoomed'); });
addEventListener('keydown', e=>{ if(e.key==='Escape') closeScroll(); });
addEventListener('resize', ()=>{ if(current) closeScroll(); });

/* ══════════════════════════════════════════════════════════════
   THE HIDDEN DOOR
   Five quick taps on the title. Your GitHub token is sealed with a
   PIN and kept in this browser only — it is never written into the
   site, so the published files hold no secret at all.
   Needs https (or localhost); browsers withhold crypto elsewhere.
   ══════════════════════════════════════════════════════════════ */
const VAULT = "pulp.key";

const gate = document.getElementById('gate');
const steps = { setup:'stepSetup', pin:'stepPin', post:'stepPost' };
function step(which){
  Object.entries(steps).forEach(([k,id])=>
    document.getElementById(id).classList.toggle('on', k === which));
}
function say(id, text, bad){
  const el = document.getElementById(id);
  el.textContent = text; el.classList.toggle('bad', !!bad);
}

/* ── sealing the token with the PIN ── */
const enc = new TextEncoder(), dec = new TextDecoder();
async function pinKey(pin, salt){
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal(pin, secret){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt(
    {name:"AES-GCM", iv}, await pinKey(pin, salt), enc.encode(secret)));
  localStorage.setItem(VAULT, JSON.stringify({s:[...salt], i:[...iv], c:[...ct]}));
}
async function unseal(pin){
  const raw = localStorage.getItem(VAULT);
  if(!raw) return null;
  const {s,i,c} = JSON.parse(raw);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(i)},
                await pinKey(pin, new Uint8Array(s)), new Uint8Array(c));
  return dec.decode(pt);
}

/* ── five taps ── */
(function(){
  const h1 = document.querySelector('h1');
  let taps = [];
  h1.addEventListener('click', ()=>{
    const now = Date.now();
    taps = taps.filter(t => now - t < 2500);
    taps.push(now);
    if(taps.length >= 5){ taps = []; openGate(); }
  });
})();

function openGate(){
  gate.classList.add('on');
  gate.setAttribute('aria-hidden','false');
  if(token) { step('post'); prefill(); }
  else if(localStorage.getItem(VAULT)){ step('pin'); focus('gPin'); }
  else { step('setup'); focus('gToken'); }
}
function closeGate(){
  gate.classList.remove('on');
  gate.setAttribute('aria-hidden','true');
  ['saySetup','sayPin','sayPost'].forEach(id => say(id, ""));
}
function focus(id){ setTimeout(()=>document.getElementById(id).focus(), 60); }
function prefill(){
  const d = new Date();
  document.getElementById('gDate').value =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

gate.querySelector('.veil').addEventListener('click', closeGate);
addEventListener('keydown', e=>{ if(e.key === 'Escape' && gate.classList.contains('on')) closeGate(); });

document.getElementById('gSave').addEventListener('click', async ()=>{
  const t = document.getElementById('gToken').value.trim();
  const p = document.getElementById('gPinNew').value;
  if(t.length < 20) return say('saySetup', "That doesn't look like a token.", true);
  if(p.length < 4)  return say('saySetup', "Give the PIN at least four characters.", true);
  try{
    await seal(p, t);
    token = t;
    document.getElementById('gToken').value = "";
    document.getElementById('gPinNew').value = "";
    step('post'); prefill();
  }catch(err){ say('saySetup', String(err.message || err), true); }
});

document.getElementById('gUnlock').addEventListener('click', unlock);
document.getElementById('gPin').addEventListener('keydown', e=>{ if(e.key === 'Enter') unlock(); });
async function unlock(){
  const p = document.getElementById('gPin').value;
  try{
    token = await unseal(p);
    document.getElementById('gPin').value = "";
    say('sayPin', "");
    step('post'); prefill();
  }catch(err){ say('sayPin', "Not that one.", true); }
}

document.getElementById('gForget').addEventListener('click', ()=>{
  localStorage.removeItem(VAULT); token = null;
  step('setup'); focus('gToken');
});

/* ── publishing ── */
function fileToBase64(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload  = ()=> res(String(fr.result).split(',')[1]);
    fr.onerror = ()=> rej(new Error("could not read that file"));
    fr.readAsDataURL(file);
  });
}

async function putFile(path, b64){
  const url = `https://api.github.com/repos/${SOURCE.user}/${SOURCE.repo}/contents/${path}`;
  const r = await fetch(url, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: "add " + path, content: b64, branch: SOURCE.branch })
  });
  if(r.ok) return true;
  if(r.status === 422) return false;                       // that name is taken
  const e = await r.json().catch(()=>({}));
  throw new Error(e.message || ("GitHub said " + r.status));
}

document.getElementById('gPost').addEventListener('click', async ()=>{
  const btn  = document.getElementById('gPost');
  const file = document.getElementById('gFile').files[0];
  const date = document.getElementById('gDate').value;
  const note = document.getElementById('gNote').value.trim();
  if(!file) return say('sayPost', "Choose the page first.", true);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return say('sayPost', "Needs a date.", true);

  const ext  = ((file.name.match(/\.[A-Za-z0-9]+$/) || [".jpg"])[0]).toLowerCase();
  const slug = note ? "-" + note.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") : "";

  btn.disabled = true;
  say('sayPost', "Sending…");
  try{
    const b64 = await fileToBase64(file);
    let done = false;
    for(let n = 0; n < 9 && !done; n++){
      const tail = n ? `-${n+1}` : "";
      done = await putFile(`${SOURCE.dir}/${date}${slug}${tail}${ext}`, b64);
    }
    if(!done) throw new Error("nine entries already share that name");
    say('sayPost', "On the shelf.");
    document.getElementById('gFile').value = "";
    document.getElementById('gNote').value = "";
    setTimeout(async ()=>{ closeGate(); render(await loadEntries()); }, 900);
  }catch(err){
    say('sayPost', String(err.message || err), true);
  }finally{
    btn.disabled = false;
  }
});

/* ── go ───────────────────────────────────────────────────── */
loadEntries().then(list=>{
  render(list);
  requestAnimationFrame(()=>{ drawPlanks(); document.body.classList.add('ready'); });
  addEventListener('load', drawPlanks);
});
</script>
</body>
</html>
