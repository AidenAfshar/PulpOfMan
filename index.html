<!-- ═══════════════════════════════════════════════════════════════════
     A PULP OF MAN
     Entries are plain text files named YYYY-MM-DD-anything.txt, living
     in the entries/ folder of the repo. The words are the entry.

     To add one: tap the title five times quickly. Nothing about that
     door is published — see THE HIDDEN DOOR near the foot of this file.
     ═══════════════════════════════════════════════════════════════ -->

    // ── Google Drive (optional; leave empty and it isn't used) ──

<style>
/* the fonts live here rather than at Google: nothing to fetch from anyone else,
   nothing to break when a third party is unreachable */
@font-face{ font-family:"Cormorant Garamond"; font-style:normal; font-weight:300;
  font-display:swap; src:url(assets/fonts/cormorant-300.woff2) format("woff2"); }
@font-face{ font-family:"Cormorant Garamond"; font-style:normal; font-weight:400;
  font-display:swap; src:url(assets/fonts/cormorant-400.woff2) format("woff2"); }
@font-face{ font-family:"Caveat"; font-style:normal; font-weight:400;
  font-display:swap; src:url(assets/fonts/caveat-400.woff2) format("woff2"); }
@font-face{ font-family:"Architects Daughter"; font-style:normal; font-weight:400;
  font-display:swap; src:url(assets/fonts/architects-daughter-400.woff2) format("woff2"); }

:root{
  --rowH: 278px;      /* one shelf's worth of vertical space          */
  --base: 60px;       /* space under a scroll's foot: slab + shadow   */
  --sink: 15px;       /* how far onto the slab's top surface it sits  */
  --shelfH: 94px;     /* rendered height of shelf.png in css pixels   */
  --ink: #2b3350;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; min-height:100vh;
  display:flex; flex-direction:column;
  color:#cdc4ad;
  font-family:"Cormorant Garamond", Georgia, serif;
  background:#131210;
  overflow-x:hidden;
  opacity:0; transition:opacity 1s ease;
}
body.ready{ opacity:1; }

/* ── the wall ─────────────────────────────────────────────── */
#wall{
  position:fixed; inset:0; z-index:-3;
  background:#131210 url(assets/wall.jpg) repeat center top;
  background-size:640px 640px;
}
#lamp{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(120% 74% at 50% -14%, rgba(255,240,208,.20) 0%, rgba(255,238,205,.05) 40%, rgba(0,0,0,0) 70%),
    radial-gradient(112% 92% at 50% 34%, rgba(0,0,0,0) 24%, rgba(0,0,0,.55) 74%, rgba(0,0,0,.86) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0) 34%, rgba(0,0,0,.60) 100%);
}
#grain{
  position:fixed; inset:0; z-index:9; pointer-events:none;
  opacity:.20; mix-blend-mode:overlay; background-repeat:repeat;
}

/* ── the title, painted on the stone ──────────────────────── */
header{ text-align:center; padding:clamp(32px,7vh,72px) 16px clamp(24px,5vh,44px); user-select:none; }
header{ position:relative; }
header::before{           /* a pool of shadow so the letters aren't fighting stone */
  content:""; position:absolute; left:50%; top:50%;
  width:min(760px, 96vw); height:190px; transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(0,0,0,.72), rgba(0,0,0,.34) 55%, rgba(0,0,0,0) 100%);
  pointer-events:none;
}
h1{
  position:relative;
  margin:0; font-weight:400;
  font-size:clamp(24px, 5.2vw, 38px);
  letter-spacing:.24em; text-indent:.24em; text-transform:uppercase;
  color:#f2e9d4;
  text-shadow:
    0 1px 1px rgba(0,0,0,.95),
    0 2px 8px rgba(0,0,0,.9),
    0 0 30px rgba(0,0,0,.8);
}

/* ── shelves ──────────────────────────────────────────────── */
main{ flex:1 0 auto; padding-bottom:clamp(24px,9vh,110px); }
#shelves{
  position:relative;
  display:flex; flex-wrap:wrap;
  align-items:flex-end;      /* a scroll stands on its own shelf   */
  align-content:flex-start;  /* and the rows stay packed at the top,
                                however many empty shelves hang below */
  padding:0 clamp(22px, 7vw, 130px);
}
.plank{
  position:absolute; z-index:0; pointer-events:none;
  left:calc(50% - 50vw); width:100vw; height:var(--shelfH);
  background:url(assets/shelf.png) repeat-x left top;
  background-size:1024px var(--shelfH);
}
.slot{
  position:relative; z-index:1;
  height:var(--rowH);
  display:flex; align-items:flex-end;
  padding-bottom:var(--base);
  cursor:pointer;
}
.slot:focus{ outline:none; }
.slot.unread{ animation:unread-nudge 5.2s ease-in-out var(--nudge-delay, 0s) infinite; }
@keyframes unread-nudge{
  0%,78%,100%{ transform:translateY(0); }
  84%{ transform:translateY(-7px); }
  89%{ transform:translateY(0); }
  93%{ transform:translateY(-3px); }
}

.scroll{
  position:relative;
  height:var(--h);
  transform-origin:50% 100%;
  transform:rotate(var(--tilt));
  transition:transform .45s cubic-bezier(.2,.9,.25,1), filter .45s ease;
  will-change:transform;
}
.scroll img{ display:block; height:100%; width:auto; }
.slot:hover .scroll, .slot:focus-visible .scroll{
  transform:translateY(-10px) rotate(var(--tilt));
  filter:brightness(1.10);
}
.scroll.hidden{ visibility:hidden; }

.scroll .shadow{               /* what it throws onto the slab */
  position:absolute; z-index:-1;
  left:-46%; right:-30%; bottom:1px; height:15px;
  background:radial-gradient(46% 50% at 56% 50%, rgba(0,0,0,.78) 0%, rgba(0,0,0,.32) 48%, rgba(0,0,0,0) 78%);
  filter:blur(2.5px);
}
.scroll .date{                 /* inked down the length of the roll */
  position:absolute; left:50%; top:52%;
  transform:translate(-50%,-50%) rotate(-90deg);
  font-family:"Caveat","Segoe Script",cursive;
  font-size:16px; line-height:1; white-space:nowrap;
  color:var(--ink); opacity:.72;
  text-shadow:0 .5px 0 rgba(255,255,255,.28);
  pointer-events:none;
}

/* ── the blue feather: today's entries only ───────────────── */
.slot.has-feather{ z-index:4; }
.feather{
  position:absolute; left:100%; top:-2px;
  width:44px; height:116px; margin-left:-16px;
  transform-origin:50% 3px;
  animation:sway 7.5s ease-in-out infinite;
  pointer-events:none;
  filter:drop-shadow(-2px 5px 5px rgba(0,0,0,.6));
}
@keyframes sway{ 0%,100%{transform:rotate(7deg)} 50%{transform:rotate(-8deg)} }

/* ── the opened scroll ────────────────────────────────────── */
#stage{ position:fixed; inset:0; z-index:20; pointer-events:none; }
#stage.on{ pointer-events:auto; }
#scrim{
  position:absolute; inset:0; opacity:0; transition:opacity .6s ease;
  background:radial-gradient(120% 90% at 50% 28%, rgba(8,7,6,.60) 0%, rgba(5,4,4,.92) 100%);
  backdrop-filter:blur(3px);
}
#stage.on #scrim{ opacity:1; }

#open{
  position:absolute; margin:0;
  display:flex; flex-direction:column; align-items:center;
  opacity:0; filter:drop-shadow(0 26px 42px rgba(0,0,0,.8));
}
#stage.on #open{ opacity:1; }
#open.flying{ transition:left .62s cubic-bezier(.22,.85,.24,1), top .62s cubic-bezier(.22,.85,.24,1), width .62s cubic-bezier(.22,.85,.24,1); }

#open .rod{
  position:relative; flex:0 0 auto; width:100%; height:23px; z-index:2;
  background:url(assets/rod-body.png) repeat-x left center;
  background-size:auto 100%;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.5));
}
#open .rod::before, #open .rod::after{
  content:""; position:absolute; top:0; width:9px; height:100%;
  background:url(assets/rod-end.png) no-repeat center/100% 100%;
}
#open .rod::before{ left:-9px; transform:scaleX(-1); }
#open .rod::after { right:-9px; }
#open .rod.bottom{ filter:brightness(.9) drop-shadow(0 4px 9px rgba(0,0,0,.55)); }

#open .sheet{
  width:100%; height:0; overflow:hidden; position:relative; z-index:1;
  background:#e9e1cb url(assets/paper.jpg) repeat;
  background-size:220px;
  box-shadow:inset 7px 0 16px -9px rgba(70,58,36,.8), inset -7px 0 16px -9px rgba(70,58,36,.8);
  transition:height .95s cubic-bezier(.24,.86,.22,1);
}
#open.unrolled .sheet{ overflow:auto; scrollbar-width:none; -ms-overflow-style:none; }
#open .sheet::-webkit-scrollbar{ display:none; }
#open .sheet::after{             /* the curl still held by the top roll */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to bottom, rgba(64,52,32,.30), rgba(64,52,32,0) 30px);
}
#open .stack{ width:100%; max-width:none; }
#open .stack .text{
  font-family:"Architects Daughter","Bradley Hand",cursive;
  font-size:1em; line-height:1.62;
  color:#242c46;
  padding:clamp(20px, 4.2%, 44px) clamp(20px, 5%, 50px);
  white-space:pre-wrap; word-break:break-word;
  text-shadow:0 .5px 0 rgba(255,255,255,.25);
  -webkit-user-select:text; user-select:text;
}
#open .stack .last-edited{
  margin-top:2.4em; padding-top:.8em;
  border-top:1px solid rgba(43,51,80,.16);
  font-family:"Cormorant Garamond", Georgia, serif;
  font-size:.78em; line-height:1.35; letter-spacing:.08em;
  text-align:right; color:rgba(43,51,80,.55);
}
#open.editing .stack{ cursor:default; }
#open .stack .scroll-editor{
  display:block; width:100%; min-height:320px; margin:0; resize:none;
  padding:clamp(44px, 7%, 66px) clamp(20px, 5%, 50px) clamp(24px, 5%, 50px);
  border:0; outline:0; background:transparent;
  font-family:"Architects Daughter","Bradley Hand",cursive;
  font-size:1em; line-height:1.62; color:#242c46;
  text-shadow:0 .5px 0 rgba(255,255,255,.25);
}
#scrollTools{
  position:absolute; z-index:6; top:31px; right:12px;
  display:flex; align-items:center; justify-content:flex-end; gap:7px;
  max-width:calc(100% - 24px); pointer-events:auto;
}
#scrollTools[hidden], #scrollTools button[hidden]{ display:none; }
#scrollTools button{
  min-width:58px; padding:6px 9px;
  border:1px solid rgba(43,51,80,.28); border-radius:2px;
  background:rgba(233,225,203,.92); color:#2b3350;
  font-family:"Cormorant Garamond", Georgia, serif; font-size:12px;
  letter-spacing:.12em; text-transform:uppercase; cursor:pointer;
  box-shadow:0 2px 8px rgba(30,24,16,.18);
}
#scrollTools button.primary{ color:#efe7d3; background:#2b3350; }
#scrollTools button:disabled{ opacity:.48; cursor:default; }
#scrollEditStatus{
  overflow:hidden; max-width:240px; padding:5px 7px;
  color:#2b3350; background:rgba(233,225,203,.92); border-radius:2px;
  font-size:13px; line-height:1.2; text-overflow:ellipsis; white-space:nowrap;
  box-shadow:0 2px 8px rgba(30,24,16,.14);
}
#scrollEditStatus:empty{ display:none; }
#scrollEditStatus.bad{ color:#8c2f28; }

#shut{
  position:absolute; z-index:30;
  top:calc(12px + env(safe-area-inset-top, 0px));
  right:calc(12px + env(safe-area-inset-right, 0px));
  width:46px; height:46px; padding:0;
  border:1px solid rgba(226,210,176,.20); border-radius:50%;
  background:rgba(18,15,12,.55); backdrop-filter:blur(6px);
  cursor:pointer; opacity:0; pointer-events:none;
  transition:opacity .45s ease .3s, background .2s ease, transform .2s ease;
}
#stage.on #shut{ opacity:1; pointer-events:auto; }
#shut:hover{ background:rgba(30,25,20,.8); transform:scale(1.06); }
#shut svg{ display:block; margin:auto; }

/* ── the hidden door: five taps on the title ───────────────── */
#gate{ position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:20px; }
#gate.on{ display:flex; }
#gate .veil{ position:absolute; inset:0; background:rgba(7,6,5,.88); backdrop-filter:blur(5px); }
#gate .leaf{
  position:relative; width:min(620px, 94vw);
  max-height:calc(100vh - 40px); overflow:auto;
  padding:30px 28px 24px;
  background:#e9e1cb url(assets/paper.jpg) repeat; background-size:220px;
  box-shadow:0 26px 54px rgba(0,0,0,.75);
  color:#2b3350;
  font-family:"Cormorant Garamond", Georgia, serif;
}
#gate h2{
  margin:0 0 18px; font-weight:400; font-size:19px;
  letter-spacing:.16em; text-transform:uppercase; opacity:.72;
}
#gate label{ display:block; font-size:15px; letter-spacing:.05em; opacity:.72; margin:14px 0 5px; }
#gate input[type=text], #gate input[type=password], #gate input[type=date]{
  width:100%; padding:9px 10px;
  font-family:"Caveat","Segoe Script",cursive; font-size:20px; color:#2b3350;
  background:rgba(255,255,255,.42); border:none;
  border-bottom:1.5px solid rgba(43,51,80,.42); border-radius:2px;
}
#gate input:focus{ outline:none; border-bottom-color:#2b3350; background:rgba(255,255,255,.62); }
#gate textarea{
  width:100%; padding:10px; resize:vertical;
  font-family:"Architects Daughter","Bradley Hand",cursive; font-size:16px; line-height:1.6;
  color:#2b3350; background:rgba(255,255,255,.42);
  border:none; border-bottom:1.5px solid rgba(43,51,80,.42); border-radius:2px;
}
#gate textarea:focus{ outline:none; border-bottom-color:#2b3350; background:rgba(255,255,255,.62); }
#gate .draft-scroll{
  margin:8px 0 4px; filter:drop-shadow(0 12px 18px rgba(50,39,23,.22));
}
#gate .draft-scroll .draft-rod{
  position:relative; height:18px; z-index:2;
  background:url(assets/rod-body.png) repeat-x left center/auto 100%;
}
#gate .draft-scroll .draft-rod::before, #gate .draft-scroll .draft-rod::after{
  content:""; position:absolute; top:0; width:7px; height:100%;
  background:url(assets/rod-end.png) no-repeat center/100% 100%;
}
#gate .draft-scroll .draft-rod::before{ left:-7px; transform:scaleX(-1); }
#gate .draft-scroll .draft-rod::after{ right:-7px; }
#gate .draft-scroll .draft-rod.bottom{ filter:brightness(.9); }
#gate .draft-scroll textarea{
  display:block; min-height:300px; max-height:48vh; margin:0; padding:30px 5% 34px;
  resize:vertical; border:0; border-radius:0; outline:0;
  background:#e9e1cb url(assets/paper.jpg) repeat; background-size:220px;
  box-shadow:inset 7px 0 16px -9px rgba(70,58,36,.55), inset -7px 0 16px -9px rgba(70,58,36,.55);
  font-size:17px; line-height:1.62; text-shadow:0 .5px 0 rgba(255,255,255,.25);
}
#gate .draft-scroll textarea:focus{ border:0; background:#e9e1cb url(assets/paper.jpg) repeat; background-size:220px; }
#gate button{
  margin-top:22px; width:100%; padding:11px;
  font-family:"Cormorant Garamond", Georgia, serif; font-size:16px;
  letter-spacing:.22em; text-transform:uppercase;
  color:#efe7d3; background:#2b3350; border:none; border-radius:2px; cursor:pointer;
}
#gate button:disabled{ opacity:.45; cursor:default; }
#gate .say{ margin-top:14px; font-size:15px; min-height:20px; letter-spacing:.03em; }
#gate .say.bad{ color:#8c2f28; }
#gate .hint{ margin-top:16px; font-size:13px; opacity:.5; line-height:1.45; }
#gate .forget{ float:right; font-size:13px; opacity:.45; cursor:pointer; text-decoration:underline; }
#gate .step{ display:none; }
#gate .step.on{ display:block; }
h1{ cursor:default; }

@media (prefers-reduced-motion: reduce){
  #open.flying, #open .sheet, .scroll, .feather, .slot.unread{ transition-duration:.001s !important; animation:none !important; }
}

@media (max-width:640px){
  :root{ --rowH:222px; --base:51px; --sink:12px; --shelfH:80px; }
  header{ padding-bottom:20px; }
  #shelves{ padding-left:12px; padding-right:12px; }
  .slot{ margin-left:5px !important; margin-right:5px !important; }
  .scroll{ height:calc(var(--h) * .78); }
  .scroll .date{ font-size:13px; }
  .feather{ width:36px; height:96px; margin-left:-14px; }
  #gate .draft-scroll textarea{ min-height:270px; font-size:19px; }
}
</style>
</head>

<body>
<div id="wall"></div>
<div id="lamp"></div>
<div id="grain"></div>

<header><h1>A Pulp Of Man</h1></header>
<main><div id="shelves"></div></main>

<div id="stage" aria-hidden="true">
  <div id="scrim"></div>
  <button id="shut" aria-label="Close" title="Close">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M2 2 L16 16 M16 2 L2 16" stroke="#e6dcc2" stroke-width="1.7"
            stroke-linecap="round" fill="none"/>
    </svg>
  </button>
  <figure id="open">
    <div class="rod top"></div>
    <div id="scrollTools" hidden aria-label="Edit this scroll">
      <span id="scrollEditStatus" aria-live="polite"></span>
      <button type="button" id="scrollEdit">Edit</button>
      <button type="button" id="scrollCancel" hidden>Cancel</button>
      <button type="button" id="scrollSave" class="primary" hidden>Save</button>
    </div>
    <div class="sheet"><div class="stack"></div></div>
    <div class="rod bottom"></div>
  </figure>
</div>

<!-- opens only after five quick taps on the title -->
<div id="gate" aria-hidden="true">
  <div class="veil"></div>
  <div class="leaf">

    <div class="step" id="stepSetup">
      <h2>First, the key</h2>
      <label for="gToken">GitHub token (fine-grained, Contents: read &amp; write)</label>
      <input id="gToken" type="password" autocomplete="off" spellcheck="false" autofocus>
      <button id="gSave">Remember on this device</button>
      <p class="hint">Kept in this browser only, and never written into the site — the
        published files hold no secret. Anyone using this browser can post, so set it up
        on your own devices only.</p>
      <div class="say" id="saySetup"></div>
    </div>

    <div class="step" id="stepPost">
      <h2>New entry <span class="forget" id="gForget">forget this device</span></h2>
      <label for="gDate">Dated</label>
      <input id="gDate" type="date">
      <label for="gNote">A word for the filename (optional)</label>
      <input id="gNote" type="text" spellcheck="false" placeholder="morning">
      <label for="gText">The entry</label>
      <div class="draft-scroll">
        <div class="draft-rod top"></div>
        <textarea id="gText" rows="11" spellcheck="true"
                  placeholder="Write it here."></textarea>
        <div class="draft-rod bottom"></div>
      </div>
      <button id="gPost">Publish</button>
      <div class="say" id="sayPost"></div>
    </div>

  </div>
</div>

<script>
/* ── a little film grain over everything ──────────────────── */
(function(){
  const s=112, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const ctx=cv.getContext('2d'), im=ctx.createImageData(s,s), D=im.data;
  let a=1337;
  const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  for(let i=0;i<s*s;i++){ const v=rnd(); D[i*4]=128; D[i*4+1]=126; D[i*4+2]=120; D[i*4+3]=v<.5?0:(v-.5)*80; }
  ctx.putImageData(im,0,0);
  document.getElementById('grain').style.backgroundImage=`url(${cv.toDataURL()})`;
})();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ── the feather ──────────────────────────────────────────── */
const FEATHER = `
<svg class="feather" viewBox="0 0 38 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

/* ── entries ──────────────────────────────────────────────── */
const FILE_RE = /\.txt$/i;
const MONTHS  = ["January","February","March","April","May","June",
                 "July","August","September","October","November","December"];
const VARIANTS = 8;

const todayKey = (()=>{ const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();

/* The date comes from the filename and nowhere else. Anchored at the start,
   so a stray number later in the name can never be mistaken for one; a date
   further in still counts, so "notes 2026-08-17.txt" works too. */
function dateFrom(name){
  const m = name.match(/^(\d{4})-(\d{2})-(\d{2})/) || name.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3];
  if(mo<1 || mo>12 || d<1 || d>31) return null;
  return { key:`${m[1]}-${m[2]}-${m[3]}`, label:`${d} ${MONTHS[mo-1]} ${y}` };
}

/* Drive serves the same file from several addresses and quietly changes which
   one it prefers, so keep a chain and let the browser fall down it. */
function driveUrls(id){
  return [ `https://lh3.googleusercontent.com/d/${id}=w1600`,
           `https://drive.google.com/thumbnail?id=${id}&sz=w1600`,
           `https://drive.google.com/uc?export=view&id=${id}` ];
}

/* An entry is a text file and nothing else: its words are the scroll. */
function makeEntry(name, textUrl, extra){
  const d = dateFrom(name);
  return Object.assign({ name, textUrl,
                         key: d && d.key, label: d ? d.label : "",
                         today: !!d && d.key === todayKey }, extra || {});
}

async function fromDrive(){
  if(!SOURCE.drive) return [];
  const r = await fetch(SOURCE.drive, {cache:"no-store"});
  if(!r.ok) throw new Error("relay " + r.status);
  const j = await r.json();
  if(j && j.ok === false) throw new Error(j.error || "relay error");
  return (j.entries || [])
    .filter(f => f && f.name && (f.id || f.url) && FILE_RE.test(f.name))
    .map(f => makeEntry(f.name, f.url || driveUrls(f.id)[0], {id: f.id}));
}

async function fromGitHub(){
  const {user, repo, branch, dir} = SOURCE;
  if(!user || /^YOUR-/.test(user)) return [];
  const head = {Accept:"application/vnd.github+json"};
  if(token) head.Authorization = "Bearer " + token;   // unlocked: a far higher rate limit
  const r = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${dir}?ref=${branch}`,
                        {headers: head, cache:"no-store"});
  if(r.status === 404) return [];                     // no entries folder yet — an empty shelf
  if(!r.ok) throw new Error("github " + r.status);
  const j = await r.json();
  if(!Array.isArray(j)) throw new Error("github: unexpected reply");
  // Read the immutable Git blob, not raw.githubusercontent.com. Raw-file caches
  // can keep serving the old branch contents even after the edit commit exists.
  return j.filter(f => f.type === "file" && FILE_RE.test(f.name))
          .map(f => makeEntry(f.name,
                 f.git_url || `https://api.github.com/repos/${user}/${repo}/git/blobs/${f.sha}`,
                 {textEncoding: "base64", textSha: f.sha}));
}

async function fromManifest(){
  const r = await fetch("entries.json", {cache:"no-store"});
  if(!r.ok) throw new Error("manifest " + r.status);
  const j = await r.json();
  const dir = SOURCE.dir || "entries";
  const list = (Array.isArray(j) ? j : j.entries || []).map(x => typeof x === "string"
    ? { name: x.split("/").pop(), url: x.includes("/") ? x : `${dir}/${x}` }
    : { name: x.name || x.file || "", url: x.url || `${dir}/${x.file || x.name}` });
  return list.filter(f => FILE_RE.test(f.name)).map(f => makeEntry(f.name, f.url));
}

/* Drive first; the others only if Drive is unset or unreachable. */
async function loadEntries(){
  for(const src of [fromDrive, fromGitHub, fromManifest]){
    try{
      const list = await src();
      if(list.length) return list;
    }catch(e){ console.warn("[pulp]", src.name, "→", e.message); }
  }
  return [];
}

/* Edit commits are permanent metadata. Their newest timestamp is written at the
   foot of the corresponding scroll, rather than in a separate site-wide list. */
const editDates = new Map();
function editedLabel(name){
  const when = new Date(editDates.get(name));
  if(Number.isNaN(when.valueOf())) return "";
  return "Last edited " + new Intl.DateTimeFormat(undefined, {
    month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"
  }).format(when);
}
function noteRecentEdit(name, at){
  editDates.set(name, at);
}
async function loadEditDates(){
  const {user, repo, branch, dir} = SOURCE;
  if(!user || /^YOUR-/.test(user)) return;
  const headers = {Accept:"application/vnd.github+json"};
  if(token) headers.Authorization = "Bearer " + token;
  try{
    const r = await fetch(`https://api.github.com/repos/${user}/${repo}/commits?sha=${encodeURIComponent(branch)}&per_page=100`,
                          {headers, cache:"no-store"});
    if(!r.ok) throw new Error("github " + r.status);
    const commits = await r.json();
    const prefix = `edit ${dir}/`;
    commits.forEach(c=>{
      const msg = String(c.commit && c.commit.message || "").split("\n")[0];
      if(!msg.startsWith(prefix) || !/\.txt$/i.test(msg)) return;
      const name = msg.slice(prefix.length);
      if(!editDates.has(name)) editDates.set(name, c.commit.author && c.commit.author.date);
    });
  }catch(err){ console.warn("[pulp] edit history →", err.message); }
}

/* ── build the shelf ──────────────────────────────────────── */
const shelves = document.getElementById('shelves');
const READ_KEY = "pulp.read.v1";
let readEntries = new Set();
try{ readEntries = new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); }catch(e){}
function markRead(name){
  if(readEntries.has(name)) return;
  readEntries.add(name);
  try{ localStorage.setItem(READ_KEY, JSON.stringify([...readEntries].slice(-500))); }catch(e){}
}

function render(entries){
  // newest first; anything whose filename carries no date goes to the very end
  entries.sort((a,b)=>
    (b.key||"").localeCompare(a.key||"") || a.name.localeCompare(b.name, undefined, {numeric:true}));
  const rnd = mulberry32(90210);
  shelves.innerHTML = "";
  entries.forEach((e, i)=>{
    const slot = document.createElement('div');
    slot.className = 'slot' + (e.today ? ' has-feather' : '') + (readEntries.has(e.name) ? '' : ' unread');
    slot.style.margin = `0 ${Math.round(7+rnd()*9)}px`;
    slot.style.setProperty('--nudge-delay', (-rnd()*5.2).toFixed(2) + 's');
    slot.tabIndex = 0;
    slot.setAttribute('role','button');
    slot.setAttribute('aria-label', e.label || e.name);

    const s = document.createElement('div');
    s.className = 'scroll';
    s.style.setProperty('--h', Math.round(166 + rnd()*52) + 'px');
    s.style.setProperty('--tilt', ((rnd()-0.5)*2.4).toFixed(2) + 'deg');
    s.style.filter = `brightness(${(0.93+rnd()*0.14).toFixed(3)})`;
    s.innerHTML =
      '<div class="shadow"></div>' +
      `<img src="assets/scroll-${Math.floor(rnd()*VARIANTS)}.png" alt="" draggable="false">` +
      (e.label ? `<div class="date">${e.label}</div>` : '') +
      (e.today ? FEATHER : '');

    // a scroll's width is only known once its image decodes — re-lay the slabs then
    s.querySelector('img').addEventListener('load', schedulePlanks);

    slot.appendChild(s);
    slot.addEventListener('click', ()=>openScroll(e, s));
    slot.addEventListener('keydown', ev=>{
      if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openScroll(e, s); }
    });
    shelves.appendChild(slot);
  });
  drawPlanks();
}

/* one stone slab under each wrapped row, wherever the row happens to land */
function drawPlanks(){
  shelves.querySelectorAll('.plank').forEach(p=>p.remove());
  const css  = getComputedStyle(document.documentElement);
  const rowH = parseFloat(css.getPropertyValue('--rowH'));
  const base = parseFloat(css.getPropertyValue('--base'));
  const sink = parseFloat(css.getPropertyValue('--sink'));

  let lastTop = 0;
  shelves.querySelectorAll('.slot').forEach(el => { if(el.offsetTop > lastTop) lastTop = el.offsetTop; });
  const filled = Math.round(lastTop / rowH) + 1;

  // exactly as many shelves as there are scrolls to stand on them
  const rows = Math.max(filled, 1);
  if(shelves.style.minHeight) shelves.style.minHeight = "";

  for(let i = 0; i < rows; i++){
    const p = document.createElement('div');
    p.className = 'plank';
    p.style.top = (i * rowH + rowH - base - sink) + 'px';
    shelves.appendChild(p);
  }
}
let plankTimer = 0;
function schedulePlanks(){ clearTimeout(plankTimer); plankTimer = setTimeout(drawPlanks, 40); }
addEventListener('resize', schedulePlanks);
if(window.ResizeObserver) new ResizeObserver(schedulePlanks).observe(shelves);

/* ── open / unroll ────────────────────────────────────────── */
const stage  = document.getElementById('stage');
const openEl = document.getElementById('open');
const sheet  = openEl.querySelector('.sheet');
const stack  = openEl.querySelector('.stack');
const scrollTools = document.getElementById('scrollTools');
const scrollEdit = document.getElementById('scrollEdit');
const scrollSave = document.getElementById('scrollSave');
const scrollCancel = document.getElementById('scrollCancel');
const scrollEditStatus = document.getElementById('scrollEditStatus');
let token = null;              // the GitHub token, only after unlocking
let current = null, currentEntry = null, busy = false, gen = 0;   // gen: which open is the live one
let scrollEditing = false, scrollSaveBusy = false;

const textCache = new Map();
function decodeBase64Utf8(content){
  const bytes = Uint8Array.from(atob(content.replace(/\s/g, "")), c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
async function transcriptOf(entry){
  if(textCache.has(entry.name)) return textCache.get(entry.name);
  const options = {cache:"no-store"};
  if(entry.textEncoding === "base64"){
    options.headers = {Accept:"application/vnd.github+json"};
    if(token) options.headers.Authorization = "Bearer " + token;
  }
  const r = await fetch(entry.textUrl, options);
  if(!r.ok) throw new Error("transcript " + r.status);
  let t;
  if(entry.textEncoding === "base64"){
    const blob = await r.json();
    if(blob.encoding !== "base64" || typeof blob.content !== "string")
      throw new Error("transcript: unexpected GitHub reply");
    t = decodeBase64Utf8(blob.content).trim();
  }else{
    t = (await r.text()).trim();
  }
  textCache.set(entry.name, t);
  return t;
}

/* fill the sheet, and report how tall it wants to be per unit of width */
async function buildContent(entry, W, mine){
  stack.textContent = "";
  let words = "";
  try{ words = await transcriptOf(entry); }
  catch(err){ console.warn("[pulp]", entry.name, "→", err.message); }
  if(mine !== gen) return 1.4;

  // a font that refuses to load must never cost us the words
  if(document.fonts && document.fonts.load)
    await document.fonts.load('1em "Architects Daughter"').catch(()=>{});
  const box = document.createElement('div');
  box.className = "text";
  box.textContent = words;
  const edited = editedLabel(entry.name);
  if(edited){
    const stamp = document.createElement('div');
    stamp.className = "last-edited";
    stamp.textContent = edited;
    box.appendChild(stamp);
  }
  stack.style.fontSize = textSize() + "px";

  // Measure at the width it will END at. The scroll is still in flight and
  // only a few pixels wide just now; measuring that gives a tall thin column.
  // The probe is a real box of the final width, so the percentage padding
  // in .text resolves against the right number too.
  const probe = document.createElement('div');
  probe.style.cssText = "position:absolute; left:0; top:0; visibility:hidden; width:" + W + "px";
  probe.appendChild(box);
  stack.appendChild(probe);
  const tall = probe.offsetHeight;
  stack.removeChild(probe);
  stack.appendChild(box);

  return Math.max(tall, 1) / W;                    // as tall as the words need
}

function scrollStatus(message, bad){
  scrollEditStatus.textContent = message || "";
  scrollEditStatus.classList.toggle('bad', !!bad);
}
function setScrollEditing(editing){
  scrollEditing = editing;
  openEl.classList.toggle('editing', editing);
  scrollEdit.hidden = editing;
  scrollCancel.hidden = !editing;
  scrollSave.hidden = !editing;
}
function resetScrollEditor(){
  scrollSaveBusy = false;
  setScrollEditing(false);
  scrollEdit.disabled = scrollSave.disabled = scrollCancel.disabled = false;
  scrollStatus("");
  scrollTools.hidden = true;
}
function sizeScrollEditor(editor){
  editor.style.height = "auto";
  editor.style.height = Math.max(sheet.clientHeight, editor.scrollHeight) + "px";
}
function fitOpenedContent(ratio){
  const W = openEl.getBoundingClientRect().width || Math.min(760, innerWidth * .92);
  const H = Math.min(W * ratio, innerHeight - 160);
  openEl.style.top = Math.round(Math.max(26, (innerHeight - (H + 56))/2)) + 'px';
  sheet.style.height = Math.round(H) + 'px';
}
async function refreshOpenedContent(entry){
  const mine = gen;
  const W = openEl.getBoundingClientRect().width || Math.min(760, innerWidth * .92);
  stack.style.width = "100%"; stack.style.fontSize = "";
  sheet.scrollLeft = 0;
  const ratio = await buildContent(entry, W, mine);
  if(mine !== gen || currentEntry !== entry) return;
  fitOpenedContent(ratio);
}
async function beginScrollEdit(){
  const entry = currentEntry;
  if(!entry || !token || scrollEditing) return;
  scrollEdit.disabled = true; scrollStatus("Loading…");
  try{
    const words = await transcriptOf(entry);
    if(currentEntry !== entry) return;
    stack.textContent = "";
    const editor = document.createElement('textarea');
    editor.className = "scroll-editor";
    editor.spellcheck = true;
    editor.value = words;
    editor.placeholder = "Write this entry…";
    stack.style.fontSize = textSize() + "px";
    stack.appendChild(editor);
    setScrollEditing(true);
    scrollStatus("");
    sheet.scrollTop = 0; sheet.scrollLeft = 0;
    sizeScrollEditor(editor);
    editor.addEventListener('input', ()=>sizeScrollEditor(editor));
    editor.focus();
  }catch(err){ scrollStatus("Could not load the words.", true); }
  finally{ scrollEdit.disabled = false; }
}
async function cancelScrollEdit(){
  const entry = currentEntry;
  if(!entry || scrollSaveBusy) return;
  setScrollEditing(false); scrollStatus("");
  await refreshOpenedContent(entry);
}
function applyEditedTranscript(entry, words, result){
  const stamp = result.commit && result.commit.author && result.commit.author.date || new Date().toISOString();
  const saved = result.content || {};
  entry.textSha = saved.sha;
  entry.textEncoding = "base64";
  entry.textUrl = saved.git_url
    || `https://api.github.com/repos/${SOURCE.user}/${SOURCE.repo}/git/blobs/${saved.sha}`;
  textCache.set(entry.name, words);
  noteRecentEdit(entry.name, stamp);
}
async function saveScrollEdit(){
  const entry = currentEntry;
  const editor = stack.querySelector('.scroll-editor');
  if(!entry || !editor || scrollSaveBusy) return;
  const words = editor.value.trim();
  scrollSaveBusy = true;
  scrollSave.disabled = scrollCancel.disabled = true;
  scrollStatus("Saving…");
  try{
    const result = await editTranscript(entry, words);
    applyEditedTranscript(entry, words, result);
    if(currentEntry === entry){
      setScrollEditing(false);
      await refreshOpenedContent(entry);
      scrollStatus("Saved");
      setTimeout(()=>{ if(currentEntry === entry && !scrollEditing) scrollStatus(""); }, 2200);
    }
  }catch(err){ scrollStatus(String(err.message || err), true); }
  finally{
    scrollSaveBusy = false;
    scrollSave.disabled = scrollCancel.disabled = false;
  }
}

scrollEdit.addEventListener('click', beginScrollEdit);
scrollCancel.addEventListener('click', cancelScrollEdit);
scrollSave.addEventListener('click', saveScrollEdit);

function openScroll(entry, el){
  if(busy || current) return;
  markRead(entry.name);
  el.parentElement.classList.remove('unread');
  busy = true; current = el; currentEntry = entry;
  const mine = ++gen;
  const r  = el.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight;
  const W  = Math.min(760, vw * 0.92);   // the final, stable reading width

  openEl.classList.remove('flying','unrolled');
  openEl.style.left  = r.left + 'px';
  openEl.style.top   = r.top  + 'px';
  openEl.style.width = r.width + 'px';
  sheet.style.height = '0px';
  sheet.scrollTop = 0;
  resetScrollEditor();
  stack.style.width = "100%"; stack.style.fontSize = "";
  sheet.scrollLeft = 0;
  stage.classList.add('on');
  stage.setAttribute('aria-hidden','false');

  // lift off straight away, rather than sitting on the shelf looking broken
  // while the words are fetched
  void openEl.offsetWidth;
  openEl.classList.add('flying');
  openEl.style.left  = Math.round((vw - W)/2) + 'px';
  openEl.style.top   = Math.round(Math.max(26, (vh - (W*1.4 + 56))/2)) + 'px';
  openEl.style.width = W + 'px';
  el.classList.add('hidden');

  // let it be closed again as soon as it has risen — nobody should be
  // trapped waiting on a fetch
  const risen = new Promise(res => setTimeout(()=>{ busy = false; res(); }, 560));
  const ready = buildContent(entry, W, mine).catch(err=>{
    console.warn("[pulp]", entry.name, "→", err.message);
    return 1.4;                                    // unroll anyway, blank
  });

  Promise.all([risen, ready]).then(([, ratio])=>{
    if(mine !== gen || current !== el) return;     // closed while we waited
    const H = Math.min(W * ratio, vh - 160);
    openEl.style.top = Math.round(Math.max(26, (vh - (H + 56))/2)) + 'px';
    openEl.classList.add('unrolled');
    sheet.style.height = Math.round(H) + 'px';
    scrollTools.hidden = !token;
  });
}

function closeScroll(){
  if(busy || scrollSaveBusy || !current) return;
  busy = true;
  const el = current;
  resetScrollEditor();
  openEl.classList.remove('unrolled');
  sheet.style.height = '0px';
  setTimeout(()=>{
    const r = el.getBoundingClientRect();
    openEl.style.left  = r.left + 'px';
    openEl.style.top   = r.top  + 'px';
    openEl.style.width = r.width + 'px';
    stage.classList.remove('on');
    stage.setAttribute('aria-hidden','true');
    setTimeout(()=>{ el.classList.remove('hidden'); current=null; currentEntry=null; busy=false; }, 480);
  }, 620);
}

function textSize(){                // denser on a desktop, larger in the hand
  return innerWidth < 640 ? 19.5 : 17;
}
document.getElementById('shut').addEventListener('click', e=>{
  e.stopPropagation(); closeScroll();
});
addEventListener('keydown', e=>{ if(e.key==='Escape') closeScroll(); });

/* A pinch, or the address bar sliding away, used to be read as a resize and
   slammed the scroll shut. Now only a real change of width does anything, and
   even then it re-lays the scroll out rather than closing it. */
let lastW = innerWidth;
let settle = 0;
addEventListener('resize', ()=>{
  if(Math.abs(innerWidth - lastW) < 40) return;     // pinch, URL bar, keyboard
  lastW = innerWidth;
  clearTimeout(settle);
  settle = setTimeout(()=>{ if(current) relayout(); }, 180);
});

function relayout(){
  const vw = innerWidth, vh = innerHeight;
  const W  = Math.min(760, vw * 0.92);
  openEl.style.width = W + 'px';
  openEl.style.left  = Math.round((vw - W) / 2) + 'px';
  if(stack.firstElementChild && stack.firstElementChild.classList.contains('text'))
    stack.style.fontSize = textSize() + "px";
  const H = Math.min(stack.scrollHeight || stack.offsetHeight, vh - 160);
  openEl.style.top = Math.round(Math.max(26, (vh - (H + 56)) / 2)) + 'px';
  sheet.style.height = Math.round(H) + 'px';
}

/* ══════════════════════════════════════════════════════════════
   THE HIDDEN DOOR
   Five quick taps on the title. Your GitHub token is remembered in
   this browser, so posting takes no password at all. Nothing about
   it is written into the site: the published files hold no secret.
   The flip side is that anyone using this browser can post, so keep
   it to devices that are yours.
   ══════════════════════════════════════════════════════════════ */
const VAULT = "pulp.key";

try{ token = localStorage.getItem(VAULT) || null; }catch(e){ token = null; }

const gate  = document.getElementById('gate');
const steps = { setup:'stepSetup', post:'stepPost' };
function step(which){
  Object.entries(steps).forEach(([k,id])=>
    document.getElementById(id).classList.toggle('on', k === which));
}
function say(id, text, bad){
  const el = document.getElementById(id);
  el.textContent = text; el.classList.toggle('bad', !!bad);
}

/* ── five taps ── */
(function(){
  const h1 = document.querySelector('h1');
  let taps = [];
  h1.addEventListener('click', ()=>{
    const now = Date.now();
    taps = taps.filter(t => now - t < 2500);
    taps.push(now);
    if(taps.length >= 5){ taps = []; openGate(); }
  });
})();

function openGate(){
  gate.classList.add('on');
  gate.setAttribute('aria-hidden','false');
  if(token){ step('post'); prefill(); }         // remembered: straight to the form
  else { step('setup'); focus('gToken'); }
}
function closeGate(){
  gate.classList.remove('on');
  gate.setAttribute('aria-hidden','true');
  ['saySetup','sayPost'].forEach(id => say(id, ""));
}
function focus(id){ setTimeout(()=>document.getElementById(id).focus(), 60); }
function prefill(){
  const d = new Date();
  document.getElementById('gDate').value =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

gate.querySelector('.veil').addEventListener('click', closeGate);
addEventListener('keydown', e=>{ if(e.key === 'Escape' && gate.classList.contains('on')) closeGate(); });

document.getElementById('gSave').addEventListener('click', ()=>{
  const t = document.getElementById('gToken').value.trim();
  if(t.length < 20) return say('saySetup', "That doesn't look like a token.", true);
  try{
    localStorage.setItem(VAULT, t);
  }catch(err){ return say('saySetup', "This browser won't keep it — private window?", true); }
  token = t;
  document.getElementById('gToken').value = "";
  step('post'); prefill();
});

document.getElementById('gForget').addEventListener('click', ()=>{
  try{ localStorage.removeItem(VAULT); }catch(e){}
  token = null;
  step('setup'); focus('gToken');
});

/* ── publishing ── */
const textBox = document.getElementById('gText');
const textToBase64 = t => btoa(String.fromCharCode(...new TextEncoder().encode(t)));

async function putFile(path, b64){
  const url = `https://api.github.com/repos/${SOURCE.user}/${SOURCE.repo}/contents/${path}`;
  const r = await fetch(url, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: "add " + path, content: b64, branch: SOURCE.branch })
  });
  if(r.ok) return true;
  if(r.status === 422) return false;                       // that name is taken
  const e = await r.json().catch(()=>({}));
  throw new Error(e.message || ("GitHub said " + r.status));
}

const githubPath = path => path.split('/').map(encodeURIComponent).join('/');
async function editTranscript(entry, words){
  const path = `${SOURCE.dir}/${entry.name}`;
  const url = `https://api.github.com/repos/${SOURCE.user}/${SOURCE.repo}/contents/${githubPath(path)}`;
  const headers = {Authorization:"Bearer " + token, Accept:"application/vnd.github+json"};
  const old = await fetch(url + "?ref=" + encodeURIComponent(SOURCE.branch), {headers, cache:"no-store"});
  let sha = null;
  if(old.ok){
    const current = await old.json(); sha = current.sha;
  }else if(old.status !== 404){
    const problem = await old.json().catch(()=>({}));
    throw new Error(problem.message || ("GitHub said " + old.status));
  }
  const body = {message:`edit ${path}`, content:textToBase64(words), branch:SOURCE.branch};
  if(sha) body.sha = sha;
  const saved = await fetch(url, {
    method:"PUT", headers,
    body:JSON.stringify(body)
  });
  if(!saved.ok){
    const problem = await saved.json().catch(()=>({}));
    if(saved.status === 409) throw new Error("That post changed elsewhere. Reload and try your edit again.");
    throw new Error(problem.message || ("GitHub said " + saved.status));
  }
  return await saved.json();
}

document.getElementById('gPost').addEventListener('click', async ()=>{
  const btn   = document.getElementById('gPost');
  const words = textBox.value.trim();
  const date  = document.getElementById('gDate').value;
  const note  = document.getElementById('gNote').value.trim();
  if(!words) return say('sayPost', "Write something first.", true);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return say('sayPost', "Needs a date.", true);

  const slug = note ? "-" + note.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") : "";

  btn.disabled = true;
  say('sayPost', "Sending…");
  try{
    const b64 = textToBase64(words);
    let path = null;
    for(let n = 0; n < 9 && !path; n++){
      const tail = n ? `-${n+1}` : "";
      const p = `${SOURCE.dir}/${date}${slug}${tail}.txt`;
      if(await putFile(p, b64)) path = p;
    }
    if(!path) throw new Error("nine entries already share that name");

    say('sayPost', "On the shelf.");
    textBox.value = "";
    document.getElementById('gNote').value = "";
    setTimeout(async ()=>{ closeGate(); render(await loadEntries()); }, 1000);
  }catch(err){
    say('sayPost', String(err.message || err), true);
  }finally{
    btn.disabled = false;
  }
});

/* ── go ───────────────────────────────────────────────────── */
Promise.all([loadEditDates(), loadEntries()]).then(([, list])=>{
  render(list);
  requestAnimationFrame(()=>{ drawPlanks(); document.body.classList.add('ready'); });
  addEventListener('load', drawPlanks);
});
</script>
